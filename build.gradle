plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
 
    //Añado el plugin para eclipse
    id 'eclipse'
    //para poder publicar paquetes en github
    id 'maven-publish'
    //Plugin para análisis estático de código
    //id "nebula.lint" version "17.7.0"
}

version = '0.2'

//Configuración de la publicación en GitHub
publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            // IMPORTANTE: Asegúrate de que jaimorgal es tu usuario de GitHub
            url = uri("https://maven.pkg.github.com/jaimorgal/audit4improve-api")         
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_LOGIN")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_PACKAGES")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            groupId = 'us.mitfs.samples'
            artifactId = 'a4i'
            version = '0.2'
            from components.java
        }
    }
}

tasks.withType(JavaCompile) {
    //Añadir la opción Xlint
    options.deprecation = true
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc){
    description = "Genera la documentación"
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.author = true
    options.version = true
    options.use = true
    options.memberLevel = JavadocMemberLevel.PROTECTED
    options.footer = "MIT-FS"
    title = "Audit4Improve-API"    
}

task defaultProperties { 
    println "Project: $project" 
    println "Name: $name" 
    println "Path: $path" 
    println "Project directory: $projectDir" 
    println "Build directory: $buildDir" 
    println "Version: $version" 
    println "Group: $project.group" 
    println "Description: $project.description" 
    println "Level: $logging.level" 
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.apache.commons:commons-math3:3.6.1'
    
    // API de GitHub
    api 'org.kohsuke:github-api:1.301'
    
    // Persistencia con Apache POI
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.2.5'
    
    // JSON API
    implementation group: 'javax.json', name: 'javax.json-api', version: '1.1.4'
    implementation 'org.glassfish:javax.json:1.1.4'
    
    implementation 'com.google.guava:guava:30.1.1-jre'
    
    // Mockito para Testing
    testImplementation 'org.mockito:mockito-core:4.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.3.1'

    // JUnit 5
	testImplementation(platform('org.junit:junit-bom:5.8.2'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

